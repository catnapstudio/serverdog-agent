# Managed by ServerDog for site abcdefghijkl.
# Saving this file from ServerDog marks it customised, and ServerDog stops regenerating it.

# orchard.com: the site
server {
    listen 80;
    listen [::]:80;
    server_name orchard.com;

    include /etc/nginx/serverdog/acme.conf;

    access_log /var/log/nginx/serverdog-abcdefghijkl-access.log;
    error_log /var/log/nginx/serverdog-abcdefghijkl-error.log;

    root /home/serverdog/orchard.com/placeholder;
    disable_symlinks if_not_owner;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri /index.html;
    }
}

# www.orchard.com: redirects to orchard.com
server {
    listen 80;
    listen [::]:80;
    server_name www.orchard.com;

    include /etc/nginx/serverdog/acme.conf;

    location / {
        return 301 http://orchard.com$request_uri;
    }
}

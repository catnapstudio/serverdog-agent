# Managed by ServerDog for site abcdefghijkl.
# Saving this file from ServerDog marks it customised, and ServerDog stops regenerating it.

include /etc/nginx/serverdog/upstreams/abcdefghijkl.conf;

# www.orchard.com over HTTP: the site
server {
    listen 80;
    listen [::]:80;
    server_name www.orchard.com;

    include /etc/nginx/serverdog/acme.conf;

    access_log /var/log/nginx/serverdog-abcdefghijkl-access.log;
    error_log /var/log/nginx/serverdog-abcdefghijkl-error.log;

    location / {
        proxy_pass http://serverdog_abcdefghijkl;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $serverdog_connection_upgrade;
    }
}

# www.orchard.com over HTTPS: the site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.orchard.com;

    ssl_certificate /etc/serverdog/certs/abcdefghijkl/orchard.com/active/fullchain.pem;
    ssl_certificate_key /etc/serverdog/certs/abcdefghijkl/orchard.com/active/privkey.pem;
    include /etc/nginx/serverdog/tls.conf;

    access_log /var/log/nginx/serverdog-abcdefghijkl-access.log;
    error_log /var/log/nginx/serverdog-abcdefghijkl-error.log;

    location / {
        proxy_pass http://serverdog_abcdefghijkl;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $serverdog_connection_upgrade;
    }
}

# orchard.com over HTTP: redirects to www.orchard.com
server {
    listen 80;
    listen [::]:80;
    server_name orchard.com;

    include /etc/nginx/serverdog/acme.conf;

    location / {
        return 301 http://www.orchard.com$request_uri;
    }
}

# orchard.com over HTTPS: redirects to www.orchard.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name orchard.com;

    ssl_certificate /etc/serverdog/certs/abcdefghijkl/orchard.com/active/fullchain.pem;
    ssl_certificate_key /etc/serverdog/certs/abcdefghijkl/orchard.com/active/privkey.pem;
    include /etc/nginx/serverdog/tls.conf;

    location / {
        return 301 https://www.orchard.com$request_uri;
    }
}

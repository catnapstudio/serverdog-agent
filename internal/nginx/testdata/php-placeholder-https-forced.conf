# Managed by ServerDog for site abcdefghijkl.
# Saving this file from ServerDog marks it customised, and ServerDog stops regenerating it.

# orchard.com over HTTP: redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name orchard.com;

    include /etc/nginx/serverdog/acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# orchard.com over HTTPS: the site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name orchard.com;

    ssl_certificate /etc/serverdog/certs/abcdefghijkl/orchard.com/active/fullchain.pem;
    ssl_certificate_key /etc/serverdog/certs/abcdefghijkl/orchard.com/active/privkey.pem;
    include /etc/nginx/serverdog/tls.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/serverdog-abcdefghijkl-access.log;
    error_log /var/log/nginx/serverdog-abcdefghijkl-error.log;

    root /home/serverdog/orchard.com/placeholder;
    disable_symlinks if_not_owner;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri /index.html;
    }
}

# www.orchard.com over HTTP: redirects to orchard.com
server {
    listen 80;
    listen [::]:80;
    server_name www.orchard.com;

    include /etc/nginx/serverdog/acme.conf;

    location / {
        return 301 https://orchard.com$request_uri;
    }
}


# Managed by ServerDog for site abcdefghijkl.
# Saving this file from ServerDog marks it customised, and ServerDog stops regenerating it.

# orchard.com: the site
server {
    listen 80;
    listen [::]:80;
    server_name orchard.com;

    include /etc/nginx/serverdog/acme.conf;

    access_log /var/log/nginx/serverdog-abcdefghijkl-access.log;
    error_log /var/log/nginx/serverdog-abcdefghijkl-error.log;

    root /home/serverdog/orchard.com/current/public;
    disable_symlinks if_not_owner;
    index index.php index.html;
    charset utf-8;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    location ~* \.(sql|sqlite|bak|old|swp)$ {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/serverdog-abcdefghijkl.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# www.orchard.com: redirects to orchard.com
server {
    listen 80;
    listen [::]:80;
    server_name www.orchard.com;

    include /etc/nginx/serverdog/acme.conf;

    location / {
        return 301 http://orchard.com$request_uri;
    }
}

# Managed by ServerDog for site abcdefghijkl.
# Saving this file from ServerDog marks it customised, and ServerDog stops regenerating it.

# docs.orchard.com: the site
server {
    listen 80;
    listen [::]:80;
    server_name docs.orchard.com;

    include /etc/nginx/serverdog/acme.conf;

    access_log /var/log/nginx/serverdog-abcdefghijkl-access.log;
    error_log /var/log/nginx/serverdog-abcdefghijkl-error.log;

    root /home/serverdog/orchard.com/current;
    disable_symlinks if_not_owner;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# orchard.dev, *.orchard.dev: the site
server {
    listen 80;
    listen [::]:80;
    server_name orchard.dev *.orchard.dev;

    include /etc/nginx/serverdog/acme.conf;

    access_log /var/log/nginx/serverdog-abcdefghijkl-access.log;
    error_log /var/log/nginx/serverdog-abcdefghijkl-error.log;

    root /home/serverdog/orchard.com/current;
    disable_symlinks if_not_owner;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# www.orchard.dev: redirects to orchard.dev
server {
    listen 80;
    listen [::]:80;
    server_name www.orchard.dev;

    include /etc/nginx/serverdog/acme.conf;

    location / {
        return 301 http://orchard.dev$request_uri;
    }
}

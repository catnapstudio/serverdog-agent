syntax = "proto3";

package serverdog.agent.v1;

option go_package = "github.com/catnapstudio/serverdog-agent/gen/serverdog/agent/v1;agentv1";

// CertificateService manages each domain's certificates. Let's Encrypt certificates are requested, issued and renewed by the agent on its own.
service CertificateService {
  rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesResponse);
  // Queues a Let's Encrypt certificate for the domain and checks DNS now ("Request Now").
  rpc RequestLetsEncrypt(RequestLetsEncryptRequest) returns (RequestLetsEncryptResponse);
  // Creates a private key on the server and returns a certificate signing request for it.
  rpc CreateSigningRequest(CreateSigningRequestRequest) returns (CreateSigningRequestResponse);
  // Installs a certificate: for a signing request (certificate_id set) or an existing certificate with its key.
  rpc InstallCertificate(InstallCertificateRequest) returns (InstallCertificateResponse);
  rpc CloneCertificate(CloneCertificateRequest) returns (CloneCertificateResponse);
  rpc ActivateCertificate(ActivateCertificateRequest) returns (ActivateCertificateResponse);
  rpc DeleteCertificate(DeleteCertificateRequest) returns (DeleteCertificateResponse);
}

enum CertificateSource {
  CERTIFICATE_SOURCE_UNSPECIFIED = 0;
  CERTIFICATE_SOURCE_LETS_ENCRYPT = 1;
  CERTIFICATE_SOURCE_SIGNING_REQUEST = 2;
  CERTIFICATE_SOURCE_UPLOADED = 3;
  CERTIFICATE_SOURCE_CLONED = 4;
}

enum CertificateState {
  CERTIFICATE_STATE_UNSPECIFIED = 0;
  CERTIFICATE_STATE_WAITING_FOR_DNS = 1;
  CERTIFICATE_STATE_ISSUING = 2;
  CERTIFICATE_STATE_ISSUED = 3;
  CERTIFICATE_STATE_RENEWAL_FAILING = 4;
  CERTIFICATE_STATE_FAILED = 5;
  CERTIFICATE_STATE_AWAITING_CERTIFICATE = 6;
}

enum KeyType {
  KEY_TYPE_UNSPECIFIED = 0;
  KEY_TYPE_ECDSA_P256 = 1;
  KEY_TYPE_RSA_2048 = 2;
}

message Certificate {
  string id = 1;
  string site_id = 2;
  string domain = 3;
  CertificateSource source = 4;
  CertificateState state = 5;
  bool active = 6;
  // Names the certificate covers (issued ones: from the certificate itself).
  repeated string names = 7;
  KeyType key_type = 8;
  string issuer = 9;
  // RFC 3339; empty until issued.
  string not_before = 10;
  string not_after = 11;
  // Why the last attempt failed, or why it is waiting (summary, blank line, detail).
  string error = 12;
  // When the agent will next check or retry; empty when nothing is scheduled.
  string next_attempt = 13;
  // When the certificate started waiting for DNS.
  string waiting_since = 14;
}

message ListCertificatesRequest {
  string site_id = 1;
}

message ListCertificatesResponse {
  repeated Certificate certificates = 1;
}

message RequestLetsEncryptRequest {
  string site_id = 1;
  string domain = 2;
  KeyType key_type = 3;
  string actor = 4;
}

message RequestLetsEncryptResponse {
  Certificate certificate = 1;
}

message CreateSigningRequestRequest {
  string site_id = 1;
  string domain = 2;
  KeyType key_type = 3;
  string actor = 4;
}

message CreateSigningRequestResponse {
  Certificate certificate = 1;
  // PEM "CERTIFICATE REQUEST" to give to the certificate provider.
  string csr = 2;
}

message InstallCertificateRequest {
  string site_id = 1;
  string domain = 2;
  // A signing request's certificate id; empty to install an existing certificate with private_key.
  string certificate_id = 3;
  // PEM: the certificate, optionally followed by its chain.
  string certificate = 4;
  // PEM intermediate certificates, if not included above.
  string chain = 5;
  // PEM private key; only for existing certificates.
  string private_key = 6;
  string actor = 7;
}

message InstallCertificateResponse {
  Certificate certificate = 1;
}

message CloneCertificateRequest {
  string site_id = 1;
  string domain = 2;
  // An issued certificate of any site on this server.
  string from_certificate_id = 3;
  string actor = 4;
}

message CloneCertificateResponse {
  Certificate certificate = 1;
}

message ActivateCertificateRequest {
  string certificate_id = 1;
  string actor = 2;
}

message ActivateCertificateResponse {
  Certificate certificate = 1;
}

message DeleteCertificateRequest {
  string certificate_id = 1;
  string actor = 2;
}

message DeleteCertificateResponse {}

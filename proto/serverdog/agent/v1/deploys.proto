syntax = "proto3";

package serverdog.agent.v1;

option go_package = "github.com/catnapstudio/serverdog-agent/gen/serverdog/agent/v1;agentv1";

// DeployService runs, follows, cancels and rolls back deploys. Added in protocol 2.
service DeployService {
  // Starts a deploy, or returns the one already running for the site.
  rpc Deploy(DeployRequest) returns (DeployResponse);
  rpc WatchDeployment(WatchDeploymentRequest) returns (stream WatchDeploymentResponse);
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  rpc CancelDeployment(CancelDeploymentRequest) returns (CancelDeploymentResponse);
  rpc Rollback(RollbackRequest) returns (RollbackResponse);
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);
}

enum DeploymentKind {
  DEPLOYMENT_KIND_UNSPECIFIED = 0;
  DEPLOYMENT_KIND_DEPLOY = 1;
  DEPLOYMENT_KIND_ROLLBACK = 2;
}

enum DeploymentState {
  DEPLOYMENT_STATE_UNSPECIFIED = 0;
  DEPLOYMENT_STATE_RUNNING = 1;
  DEPLOYMENT_STATE_SUCCEEDED = 2;
  DEPLOYMENT_STATE_FAILED = 3;
  DEPLOYMENT_STATE_CANCELLED = 4;
  DEPLOYMENT_STATE_TIMED_OUT = 5;
  DEPLOYMENT_STATE_INTERRUPTED = 6;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  // The script before $CREATE_RELEASE().
  PHASE_PREPARE = 1;
  PHASE_FETCH = 2;
  PHASE_CHECK_OUT = 3;
  PHASE_LINK_SHARED = 4;
  PHASE_BUILD = 5;
  PHASE_ACTIVATE = 6;
  PHASE_AFTER_ACTIVATION = 7;
  PHASE_CLEAN_UP = 8;
}

enum PhaseState {
  PHASE_STATE_UNSPECIFIED = 0;
  PHASE_STATE_PENDING = 1;
  PHASE_STATE_RUNNING = 2;
  PHASE_STATE_DONE = 3;
  PHASE_STATE_FAILED = 4;
  PHASE_STATE_SKIPPED = 5;
}

message PhaseStatus {
  Phase phase = 1;
  PhaseState state = 2;
  // RFC 3339; empty until set.
  string started_at = 3;
  string finished_at = 4;
  // e.g. "main at b4c5d6e", "releases/20261016-181245".
  string note = 5;
}

message Deployment {
  string id = 1;
  string site_id = 2;
  DeploymentKind kind = 3;
  DeploymentState state = 4;
  // True once the new release (or rollback target) is live.
  bool went_live = 5;
  string actor = 6;
  string branch = 7;
  string commit = 8;
  string commit_author = 9;
  string commit_message = 10;
  // Release directory name, e.g. "20261016-181245".
  string release = 11;
  repeated PhaseStatus phases = 12;
  // One-sentence reason when the deployment didn't succeed.
  string error = 13;
  // RFC 3339; finished_at is empty while running.
  string started_at = 14;
  string finished_at = 15;
}

message DeployRequest {
  string site_id = 1;
  string actor = 2;
}

message DeployResponse {
  Deployment deployment = 1;
  // True when a deploy was already running and is returned instead of starting a new one.
  bool already_running = 2;
}

message WatchDeploymentRequest {
  string id = 1;
  // Byte offset into the deployment's log to resume from; 0 for the start.
  uint64 from_offset = 2;
}

message LogChunk {
  string text = 1;
  // Offset to resume from after this chunk.
  uint64 next_offset = 2;
}

message CurrentCommand {
  // The command the script is about to run, as typed.
  string text = 1;
  uint64 next_offset = 2;
}

message WatchDeploymentResponse {
  oneof event {
    // Sent first and whenever phases or state change. The stream ends after a final state.
    Deployment deployment = 1;
    LogChunk log = 2;
    CurrentCommand command = 3;
  }
}

message ListDeploymentsRequest {
  string site_id = 1;
  uint32 limit = 2;
}

message ListDeploymentsResponse {
  // Newest first.
  repeated Deployment deployments = 1;
}

message CancelDeploymentRequest {
  string id = 1;
  string actor = 2;
}

message CancelDeploymentResponse {
  Deployment deployment = 1;
}

message RollbackRequest {
  string site_id = 1;
  // A kept release directory name.
  string release = 2;
  string actor = 3;
}

message RollbackResponse {
  Deployment deployment = 1;
}

message ListReleasesRequest {
  string site_id = 1;
}

message Release {
  string name = 1;
  string commit = 2;
  string commit_message = 3;
  bool live = 4;
}

message ListReleasesResponse {
  // Newest first.
  repeated Release releases = 1;
}
